# Spamtroll Anti-Spam ACL for Exim
# This file is auto-generated by Spamtroll DirectAdmin plugin
# Location: /etc/exim.acl_check_message.pre.conf
#
# DirectAdmin includes this file automatically in the DATA ACL.
# No modifications to the main Exim configuration are required.
#
# How it works:
# 1. For each incoming email, Exim runs /usr/local/bin/spamtroll-check
# 2. The script sends the email content to the Spamtroll API
# 3. Based on the API response, an X-Spamtroll-* header is added
#
# This file contains no `deny` and no `defer`, by design. Every error
# path — API outage, quota exhaustion, missing script, expansion
# failure — ends with no header added and the message accepted.
# Fail-closed on the mail path means lost correspondence.

# NOTE: an earlier revision tried `hosts = +relay_from_hosts`, but that
# named host list isn't defined in a stock DirectAdmin Exim config.
# Exim returned `deferred` for the whole ACL line, which short-circuits
# evaluation — the spamtroll-check rule below never ran, so no email was
# ever scored and /var/log/spamtroll.log stayed empty.
#
# NOTE: outgoing mail (authenticated SMTP, or submitted over loopback by
# Roundcube / sendmail / cron) is excluded with negative conditions on
# the `warn` verb below, NOT with a leading `accept`. An `accept` here
# ends evaluation of the *whole* acl_check_message, which would skip
# everything DirectAdmin appends after this file — ClamAV (`malware =
# *`), SpamAssassin, outbound rate limits and any admin rules — for all
# authenticated and locally injected mail.

# Check incoming email with Spamtroll.
#
# Argument passing: every value taken from the message is base64-encoded
# and carries a one-letter marker prefix. Two Exim behaviours make the
# naive `"$h_subject:"` form unsafe:
#
#   * Exim >= 4.96 splits the ${run} command into arguments first and
#     expands each argument afterwards, so a value containing spaces or
#     quotes stays one argument — but a value containing whitespace in
#     the *unexpanded* text (e.g. `{ }` inside ${sg}) splits early.
#   * Older releases (and `${run,preexpand}`) expand the whole command
#     first and split afterwards, so a single `"` in a Subject shifts
#     every following argument, and an argument that expands to nothing
#     is dropped entirely — silently corrupting or skipping the scan.
#
# The base64 alphabet has no whitespace and no quotes, and the marker
# prefix keeps every argument non-empty, so the argument vector is
# stable under both behaviours.
#
# $message_headers_raw is the byte-exact header block (Exim caps it at
# header_insert_maxlen, 64K); the script pairs it with the message body
# read from the spool -D file to reconstruct the full RFC 822 message
# for cryptographic DKIM verification. $message_body is passed too, but
# only as a fallback: it is capped by the main option
# message_body_visible, which defaults to 500 bytes.
#
# Exit codes: 0 = safe, 1 = blocked, 2 = error (fail-open), 3 = suspicious.
# $value holds the script's stdout, which is the numeric spam score.

warn
  !authenticated = *
  !hosts = 127.0.0.1 : ::1
  set acl_m_spamtroll = ${run{/usr/local/bin/spamtroll-check \
    i$sender_host_address \
    s$sender_address \
    m$message_exim_id \
    d$spool_directory \
    f${base64:$h_from:} \
    t${base64:$h_to:} \
    u${base64:$h_subject:} \
    n${base64:$h_message-id:} \
    h${base64:$message_headers_raw} \
    b${base64:$message_body}}{$runrc/$value}{$runrc/$value}}
  set acl_m_spamtroll_score = ${if match{$acl_m_spamtroll}{\N^[0-3]/(-?[0-9]+(\.[0-9]+)?)\N}{$1}{}}

# OBSERVATION MODE: the algorithm is still being tuned and was
# producing false positives on legitimate transactional mail. Until the
# content-analysis tune is stable, we mark verdicts via
# X-Spamtroll-Status / X-Spamtroll-Score headers only — no SMTP reject.
# Users route with Sieve / Procmail / IMAP filters on the header.
# Switch to a `deny` rule once the false-positive rate is low.
#
# A missing rc (expansion failed, script absent, killed) leaves
# $acl_m_spamtroll matching none of the rules below: no header, message
# accepted. Same for rc 2, which the script uses for its own errors.

warn
  condition = ${if match{$acl_m_spamtroll}{\N^1/\N}{yes}{no}}
  add_header = X-Spamtroll-Status: spam
  log_message = Spamtroll marked as spam (observation mode): from=<$sender_address> ip=$sender_host_address

warn
  condition = ${if match{$acl_m_spamtroll}{\N^3/\N}{yes}{no}}
  add_header = X-Spamtroll-Status: suspicious
  log_message = Spamtroll marked as suspicious (observation mode): from=<$sender_address> ip=$sender_host_address

warn
  condition = ${if match{$acl_m_spamtroll}{\N^0/\N}{yes}{no}}
  add_header = X-Spamtroll-Status: clean

# Score header lives in its own verb: if this expansion ever fails, the
# status headers above are already added and stay added. The value can
# only be what the regex above captured, i.e. an optionally signed
# decimal number — nothing from the message can reach a header here.
warn
  condition = ${if eq{$acl_m_spamtroll_score}{}{no}{yes}}
  add_header = X-Spamtroll-Score: $acl_m_spamtroll_score

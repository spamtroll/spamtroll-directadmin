# Spamtroll native spam handling for DirectAdmin (post-scan verdict translation).
#
# Installed by the Spamtroll DirectAdmin plugin to
# /etc/exim.acl_check_message.post.conf. Stock DirectAdmin exim.conf
# pulls this file in at the END of the DATA ACL, after the
# SpamAssassin/rspamd stage (/etc/exim/spamd.acl_smtp_data.conf).
# That position is the whole point: the SA/rspamd stage runs
# `remove_header X-Spam-Status` and then writes its own verdict, so a
# native header added any earlier (in acl_check_message.pre.conf) would
# be wiped there whenever the recipient uses SpamAssassin/rspamd.
#
# What happens here, per message:
# - Spamtroll says spam (scanner exit 1) and SA/rspamd did NOT already
#   flag the message: publish the native `X-Spam-Status: Yes` header.
#   DirectAdmin's own per-domain filters (/etc/virtual/<domain>/filter)
#   check exactly `$h_X-Spam-Status: contains "Yes,"` and file the
#   message into the user's Spam folder — no Sieve rules, no user
#   configuration. Vacation and autoresponder routers skip Yes-status
#   mail the same way, just like SA-flagged spam.
# - SA/rspamd already flagged the message: their header stands
#   untouched. This plugin never downgrades another engine's verdict.
# - Anything else (clean, suspicious, scan error, SA disabled and
#   Spamtroll clean): add nothing. A `suspicious` verdict stays visible
#   as X-Spamtroll-Status for optional user-side Sieve rules.
#
# How an earlier SA/rspamd verdict is detected: NOT via $h_X-Spam-Status.
# Headers added by add_header during the DATA ACL run are not visible
# to $h_ expansions in that same run (proven by the CI gate: with only
# a $h_ guard, our header was added alongside SA's). The stock
# SpamBlocker SA/rspamd stage (/etc/exim/spamd.acl_smtp_data.conf) sets
# `acl_m_is_spam = 1` in its spam branch, and ACL variables do persist
# for the message — so that variable is the signal. The $h_ guard stays
# as a second condition for a foreign Yes that reached us untouched (SA
# stage skipped for the recipient): then there is equally nothing to add.
#
# This file contains no `deny` and no `defer`, by design — the same
# contract as the pre-scan hook. A missing verdict variable (old
# pre.conf, failed expansion) matches nothing and the message is
# accepted unmarked.
#
# Scanner exit codes: 0 = safe, 1 = blocked, 2 = error (fail-open),
# 3 = suspicious. acl_m_spamtroll holds "<rc>/<score>" and
# acl_m_spamtroll_score the numeric score; both are set in
# acl_check_message.pre.conf and persist for the message.

warn
  condition = ${if match{$acl_m_spamtroll}{\N^1/\N}{yes}{no}}
  condition = ${if eq{$acl_m_is_spam}{1}{no}{yes}}
  condition = ${if match{$h_X-Spam-Status:}{Yes}{no}{yes}}
  remove_header = X-Spam-Status
  add_header = X-Spam-Status: Yes, spamtroll score=${if eq{$acl_m_spamtroll_score}{}{unknown}{$acl_m_spamtroll_score}}
  log_message = Spamtroll native-marked as spam: from=<$sender_address> ip=$sender_host_address
